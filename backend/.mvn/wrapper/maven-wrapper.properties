# TuneFlow ships the Apache Maven Wrapper so the backend can be built on a machine that has a
# JDK but no Maven installed - e.g. a Windows box using the JDK bundled with Android Studio:
#
#     mvnw.cmd -B -DskipTests package
#
# First run downloads Maven 3.9.9 itself into %USERPROFILE%\.m2\wrapper\dists (needs internet once).
wrapperVersion=3.3.2
distributionType=bin
distributionUrl=https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.9/apache-maven-3.9.9-bin.zip
wrapperUrl=https://repo.maven.apache.org/maven2/org/apache/maven/wrapper/maven-wrapper/3.3.2/maven-wrapper-3.3.2.jar
